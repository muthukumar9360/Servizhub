  <title>Servizhub – Work Connect</title>
  <style>
    /* Completely hide Netlify injected badge / HUD widget frames */
    #nl-badge-frame,
    #nl-hud-frame,
    iframe[id^="nl-"],
    iframe[title*="Netlify"],
    iframe[src*="netlify"] {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
      pointer-events: none !important;
      width: 0 !important;
      height: 0 !important;
      position: absolute !important;
      left: -9999px !important;
      top: -9999px !important;
      z-index: -9999 !important;
    }
  </style>
</head>
